// Default controls — bind-id names follow the retail bind table.
// Host defaults, not a dump of retail config_mp.cfg.
// Edit and re-run `binddefaults`, or paste lines into the console.

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +gostand
bind C +movedown
bind CTRL +prone
bind SHIFT +sprint

bind MOUSE1 +attack
bind MOUSE2 +toggleads_throw
bind MOUSE3 weapnext

bind R +reload
bind V +melee
bind E +activate
bind F +frag
bind G +smoke
bind TAB +scores

bind 2 +left
bind 3 +right
bind 4 +actionslot 4

// Gamepad, console MW2 layout. START opens the mod menu and BACK the pause
// menu; in a menu the D-pad moves, A picks and B goes back.
bind BUTTON_A +gostand
bind BUTTON_B +stance
bind BUTTON_X +usereload
bind BUTTON_Y weapnext
bind BUTTON_LSHLDR +smoke
bind BUTTON_RSHLDR +frag
bind BUTTON_LTRIG +speed_throw
bind BUTTON_RTRIG +attack
bind BUTTON_LSTICK +breath_sprint
bind BUTTON_RSTICK +melee
bind DPAD_UP +actionslot 1
bind DPAD_DOWN +actionslot 2
bind DPAD_LEFT +actionslot 3
bind DPAD_RIGHT +actionslot 4
